# Publish @linbin-mk/dsh-brand-deepseek to npm from a GitHub Release.
#
# Authentication uses npm trusted publishing (OIDC), so no NPM_TOKEN secret is
# stored in this repository. The connection is configured once on npm:
#
#   Package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : linbin-mk
#     Repository           : dsh-brand-deepseek
#     Workflow filename    : publish.yml
#     Environment          : (leave empty)
#     Allow npm publish    : checked
#
# The "Allow npm publish" checkbox matters: npm's default grants only *staged*
# publishing, which leaves a green run with nothing published.
#
# npm has no pending-publisher concept, so the very first version must be
# published by hand (`npm publish` in your own terminal, from the tagged
# commit). Trusted publishing takes over from the next release on.
#
# Releasing: bump "version" in package.json, commit, tag `v<version>`, push the
# tag, then publish a GitHub Release for that tag. The tag must agree with
# package.json, and a version already on the registry is skipped — so a manual
# `workflow_dispatch` run is a safe rehearsal that only installs, builds and
# tests.

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing and provenance.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # pnpm comes from npm rather than pnpm/action-setup: that action's
      # self-installer downloads a standalone binary and failed here with
      # "self-installer exits with code 1" before any project step ran. The
      # version is read from package.json so a bump cannot drift.
      - name: Install pnpm from package.json#packageManager
        run: |
          pnpm_version=$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")
          npm install -g "pnpm@$pnpm_version"
          pnpm --version

      - name: Require npm 11.5.1 or later for trusted publishing
        run: |
          node -e '
            const { execSync } = require("node:child_process")
            const tooOld = (v) => {
              const [major = 0, minor = 0, patch = 0] = v.split(".").map(Number)
              return major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))
            }
            let version = execSync("npm --version").toString().trim()
            if (tooOld(version)) {
              console.log(`npm ${version} is too old — installing npm@11`)
              execSync("npm install -g npm@11", { stdio: "inherit" })
              version = execSync("npm --version").toString().trim()
            }
            console.log(`npm ${version}`)
            if (tooOld(version)) {
              console.error("npm 11.5.1 or later is required for trusted publishing")
              process.exit(1)
            }
          '

      - run: pnpm install --frozen-lockfile

      # The committed lib/ is what ships, so rebuilding it must be a no-op.
      - run: pnpm run build:check

      - run: pnpm test

      - name: Check the release tag against package.json
        if: ${{ github.event_name == 'release' }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const { version } = require("./package.json")
            const tag = process.env.RELEASE_TAG
            if (tag !== `v${version}`) {
              console.error(`release tag ${tag} does not match package.json ${version}`)
              process.exit(1)
            }
            console.log(`release tag ${tag} matches package.json`)
          '

      - name: Check whether this version is already published
        id: registry
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@linbin-mk/dsh-brand-deepseek@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@linbin-mk/dsh-brand-deepseek@$version is already on the registry — nothing to publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # --ignore-scripts keeps the tarball exactly the committed artifact: no
      # rebuild happens between the checks above and the publish.
      - name: Publish to npm
        if: ${{ github.event_name == 'release' && steps.registry.outputs.published == 'false' }}
        run: npm publish --ignore-scripts --provenance --access public
